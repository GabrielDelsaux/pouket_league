<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pouket League</title>
<style>
:root{--bg:#070b1f;--fg:#eef1ff;--blue:#38a3ff;--org:#ff8a1f;--panel:#141b3d;--line:#2b3a7a}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button,input{font:inherit;color:var(--fg);border-radius:10px;border:2px solid var(--line);background:var(--panel);padding:10px 14px}
button{cursor:pointer;background:#243063}button:hover:not(:disabled){background:#2f3f85}button:disabled{opacity:.45;cursor:default}
/* lobby */
#lobby{position:fixed;inset:0;z-index:10;display:flex;background:linear-gradient(90deg,#070b1ff5 0%,#070b1fe8 42%,#070b1f00 78%);overflow:auto}
#lcol{width:min(500px,94vw);padding:22px 26px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
h1{font:900 clamp(30px,5vw,54px)/1 "Arial Black",Impact,sans-serif;margin:0;letter-spacing:-1px;background:linear-gradient(90deg,var(--blue),#fff,var(--org));-webkit-background-clip:text;background-clip:text;color:transparent}
#conn{font-size:12px;opacity:.7;min-height:1.2em}
#tabs{display:flex;gap:6px}#tabs button{flex:1;padding:8px 2px;font-size:14px;min-width:0}#tabs button.on{background:linear-gradient(90deg,#1f7bd6,#6a4fd6);border-color:#6a8aff}
.tab{display:none;flex-direction:column;gap:10px}.tab.on{display:flex}
label{font-size:13px;opacity:.75;margin-top:4px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
#cars{display:flex;gap:8px}
.card{flex:1;text-align:center;padding:10px 6px;border-radius:12px;border:2px solid var(--line);background:var(--panel);cursor:pointer}
.card.on{border-color:#ffd24a;background:#1f2a5e}.card b{display:block}.card small{opacity:.7;font-size:11px}
#cdesc{font-size:13px;opacity:.8;min-height:1.3em}
.rk{display:flex;justify-content:space-between;align-items:center;font-weight:700;background:linear-gradient(90deg,#7a2fd6,#d6327a);border:0;padding:13px 16px}
.rk small{font-weight:500;opacity:.9}
#go{font-weight:700;background:linear-gradient(90deg,#1f7bd6,#e06f0b);border:0}
#err{color:#ff7a7a;min-height:1.2em;margin:0}
.hint{opacity:.65;font-size:12px;line-height:1.5;margin:0}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:13px;color:#10142c;background:var(--c,#999)}
.pcard{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px}
.phead{display:flex;gap:12px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:900 24px "Arial Black",sans-serif;color:#10142c;background:linear-gradient(135deg,#ffd24a,#ff8a1f)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.grid b{display:block;font-size:20px}.grid small{opacity:.65;font-size:11px}
.bar{height:6px;border-radius:4px;background:#ffffff22;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,#ffd24a)}
.rkrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist{font-size:13px;display:flex;flex-direction:column;gap:3px}.hist span.w{color:#6dff9c}.hist span.l{color:#ff7a7a}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px 6px;border-bottom:1px solid #ffffff14}tr.me td{background:#ffd24a22}
#lbt{display:flex;gap:6px}#lbt button{flex:1;padding:6px}#lbt button.on{background:#6a4fd6}
#queue{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#070b1fd9}
#qt{font:900 34px "Arial Black",sans-serif}
/* paramètres */
.krow{display:grid;grid-template-columns:1fr 104px 104px;gap:6px;align-items:center;font-size:14px}
.kb{padding:6px 4px;font-size:13px;min-width:0}
.kb.wait{border-color:#ffd24a;background:#3a3410;color:#ffd24a}
#setov{position:fixed;inset:0;z-index:20;display:none;background:#070b1ff2;overflow:auto;justify-content:center;align-items:flex-start;padding:20px 0;box-sizing:border-box}
#setbox{width:min(520px,94vw);display:flex;flex-direction:column;gap:10px}
#setbody{display:flex;flex-direction:column;gap:10px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#score{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#000a;padding:6px 18px;border-radius:12px}
#score b{font:900 40px "Arial Black",sans-serif;min-width:34px;text-align:center}
#s0{color:var(--blue)}#s1{color:var(--org)}#tm{font:bold 22px system-ui;min-width:70px;text-align:center}
#roster{position:absolute;top:12px;left:14px;font-size:14px;line-height:1.5;text-shadow:0 1px 3px #000}
#roster small{opacity:.7;margin-left:4px;font-size:11px}
#mode{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:2px;color:#ffd24a;text-shadow:0 1px 3px #000}
#ping{position:absolute;bottom:10px;left:14px;font-size:12px;opacity:.7}
#boost{--p:0;position:absolute;right:28px;bottom:28px;width:110px;height:110px;border-radius:50%;background:conic-gradient(#ffd24a calc(var(--p)*1%),#ffffff22 0);display:grid;place-items:center}
#boost::before{content:"";position:absolute;inset:10px;border-radius:50%;background:#0a0f24ee}
#bv{position:relative;font:900 30px "Arial Black",sans-serif;font-style:normal}
#msg{position:absolute;top:28%;left:0;right:0;text-align:center;font:900 clamp(40px,9vw,110px)/1.1 "Arial Black",sans-serif;text-shadow:0 4px 16px #000}
#msg small{display:block;font:600 clamp(14px,2vw,24px) system-ui;margin-top:12px;color:#fff}
#bar{position:absolute;top:10px;right:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;font-size:13px;pointer-events:auto;max-width:42vw}
#bar button{padding:6px 10px;font-size:12px}#rc{font-weight:700;letter-spacing:2px;color:#ffd24a}
#help{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.65;white-space:nowrap}
#toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
</style></head><body>
<canvas id="gl"></canvas>
<div id="lobby"><div id="lcol">
  <h1>POUKET LEAGUE</h1><div id="conn">Connexion au serveur…</div>
  <div id="tabs"><button data-tab="play" class="on">Jouer</button><button data-tab="prof">Profil</button><button data-tab="lb">Classement</button><button data-tab="set">Paramètres</button></div>
  <div class="tab on" id="t-play">
    <label>Pseudo</label><input id="name" maxlength="14" placeholder="Ton pseudo" autocomplete="off">
    <label>Voiture</label><div id="cars"></div><div id="cdesc"></div>
    <label>Parties classées</label>
    <button class="rk" id="r1" disabled><span>Classé 1v1</span><small id="r1r"></small></button>
    <button class="rk" id="r2" disabled><span>Classé 2v2</span><small id="r2r"></small></button>
    <label>Partie libre</label>
    <div class="row"><input id="room" maxlength="6" placeholder="Code du salon (vide = nouveau)" autocomplete="off"><button id="go" disabled>Jouer</button></div>
    <p id="err"></p>
    <p class="hint" id="hintp"></p>
  </div>
  <div class="tab" id="t-prof"></div>
  <div class="tab" id="t-lb"></div>
  <div class="tab" id="t-set"></div>
</div></div>
<div id="queue"><div id="qt">Recherche d'une partie…</div><div id="qs" style="opacity:.8"></div><button id="qc">Annuler</button></div>
<div id="setov"><div id="setbox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Paramètres</h2><button id="setx">Fermer</button></div><div id="setbody"></div></div></div>
<div id="hud">
  <div id="score"><b id="s0">0</b><span id="tm">3:00</span><b id="s1">0</b></div>
  <div id="roster"></div><div id="mode"></div><div id="ping"></div>
  <div id="boost"><i id="bv">0</i></div><div id="msg"></div>
  <div id="bar"><span id="rc"></span><button id="copy">Copier le lien</button><button id="addbot">+ Bot</button><button id="rmbot">− Bot</button><button id="team">Équipe</button><button id="setb">Paramètres</button><button id="fsb2" class="fsbtn">Plein écran</button><button id="leave">Quitter</button></div>
  <div id="help"></div>
</div>
<div id="toast"></div>
<script src="/vendor/three.min.js"></script>
<script>
/* dimensions de l'arène : par défaut l'ancienne, remplacées par celles envoyées par le serveur (message "ar") */
let AW=80,AL=120,AH=32,GW=16,GH=8,GD=8,CR=0,GR=0;const BR=2.8;
const TC=['#38a3ff','#ff8a1f'],TCN=[0x38a3ff,0xff8a1f];
const CARINFO={octane:['Octane','Polyvalente · hitbox équilibrée'],fennec:['Fennec','Carrée et haute · large zone de contact'],dominus:['Dominus','Basse et longue · frappes à plat']};
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrap=d=>{d%=6.28319;if(d>3.14159)d-=6.28319;if(d<-3.14159)d+=6.28319;return d};
const hex=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('');
let ws,ready=false,PROF=null,myCar='octane',myId=0,room='',ranked=0,plist=0,roster={},snaps=[],ping=0,joined=false,lastIn='',actx=null,ballCam=true,shake=0,banner=null,lastCd=-1,msgKey='',lastRes=null,qStart=0,qTimer=0,pingT=0,cheer=0,specT=0,specF=0,LAYOUT=null,rebind=null,setOpen=false;
let tok='';try{tok=localStorage.getItem('pl_tok')||'';if(!/^[a-f0-9]{32}$/.test(tok)){tok=hex(16);localStorage.setItem('pl_tok',tok)}}catch(e){tok=hex(16)}

/* ---------- touches (modifiables dans Paramètres) ---------- */
const KDEF={fwd:['KeyW','ArrowUp'],back:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],jump:['Space',''],boost:['ShiftLeft','Mouse2'],drift:['KeyV','Mouse0'],rollL:['KeyQ',''],rollR:['KeyE',''],cam:['KeyC',''],addbot:['KeyB',''],rmbot:['KeyN',''],team:['KeyT',''],full:['KeyF','']};
const ACTS=[['fwd','Avancer'],['back','Reculer'],['left','Tourner à gauche'],['right','Tourner à droite'],['jump','Saut / dash'],['boost','Turbo'],['drift','Dérapage'],['rollL','Rouler à gauche (en l\'air)'],['rollR','Rouler à droite (en l\'air)'],['cam','Caméra balle / voiture'],['addbot','Ajouter un bot'],['rmbot','Retirer un bot'],['team','Changer d\'équipe'],['full','Plein écran']];
const cloneKeys=o=>{const n={};for(const k in o)n[k]=o[k].slice();return n};
let BIND=cloneKeys(KDEF);
const serKeys=()=>{const o={};for(const k in BIND)o[k]=BIND[k].join(',');return o};
function applyKeys(o){if(!o||typeof o!=='object')return;const n=cloneKeys(KDEF);
  for(const k in n)if(typeof o[k]==='string'){const p=o[k].split(',');n[k]=[0,1].map(i=>/^[A-Za-z0-9]{1,14}$/.test(p[i]||'')?p[i]:'')}
  BIND=n}
function saveKeys(){try{localStorage.setItem('pl_keys',JSON.stringify(serKeys()))}catch(e){}send({t:'keys',k:serKeys()})}
let localKeys=null;try{localKeys=JSON.parse(localStorage.getItem('pl_keys')||'null');applyKeys(localKeys)}catch(e){}
const norm=c=>c==='ShiftRight'?'ShiftLeft':c==='ControlRight'?'ControlLeft':c==='AltRight'?'AltLeft':c;
const isBound=c=>Object.values(BIND).some(a=>a.includes(c));
function keyLabel(c){if(!c)return '—';
  if(c.startsWith('Mouse'))return ['Clic gauche','Clic molette','Clic droit','Souris 4','Souris 5'][+c.slice(5)]||c;
  const sp={Space:'Espace',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Enter:'Entrée',Tab:'Tab',ShiftLeft:'Maj',ControlLeft:'Ctrl',AltLeft:'Alt',Backquote:'²'};
  if(sp[c])return sp[c];const m=LAYOUT&&LAYOUT.get&&LAYOUT.get(c);if(m)return m.toUpperCase();
  if(c.startsWith('Key'))return c.slice(3);if(c.startsWith('Digit'))return c.slice(5);return c}
const KL=a=>BIND[a].filter(Boolean).map(keyLabel).join(' / ')||'—';
function updateHelp(){
  $('#help').textContent=`Saut : ${KL('jump')} (2× + direction = dash) · Turbo : ${KL('boost')} · Dérapage : ${KL('drift')} · Caméra : ${KL('cam')}`;
  $('#hintp').textContent=`Avancer : ${KL('fwd')} · Reculer : ${KL('back')} · Tourner : ${KL('left')} / ${KL('right')} · Saut (2e appui + direction = dash) : ${KL('jump')} · Turbo : ${KL('boost')} · Dérapage : ${KL('drift')} · Rouler en l'air : ${KL('rollL')} / ${KL('rollR')} · Caméra balle/voiture : ${KL('cam')} — tout est modifiable dans l'onglet Paramètres.`}
const isFull=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function toggleFull(){const d=document;try{let p;
  if(isFull())p=(d.exitFullscreen||d.webkitExitFullscreen).call(d);else{const e=d.documentElement;p=(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}
  if(p&&p.catch)p.catch(()=>toast('Plein écran refusé par le navigateur'))}catch(e){toast('Plein écran indisponible')}}
function settingsHTML(){
  const rows=ACTS.map(([a,l])=>`<div class="krow"><span>${l}</span>${[0,1].map(s=>{const w=rebind&&rebind.a===a&&rebind.s===s;return `<button class="kb${w?' wait':''}" data-a="${a}" data-s="${s}">${w?'Appuie…':keyLabel(BIND[a][s])}</button>`}).join('')}</div>`).join('');
  return `<div class="pcard"><b>Affichage</b><div style="margin-top:8px"><button class="fsbtn" style="width:100%">${isFull()?'Quitter le plein écran':'Passer en plein écran'}</button></div></div>
  <div class="pcard"><b>Touches</b><p class="hint" style="margin:6px 0 10px">Clique sur une case, puis appuie sur la touche voulue (ou clique avec la souris dans une zone vide). Échap : annuler · Retour arrière : effacer. Chaque action peut avoir 2 touches.</p>
  <div style="display:flex;flex-direction:column;gap:6px">${rows}</div><button class="rstkeys" style="width:100%;margin-top:12px">Réinitialiser les touches</button></div>`}
function renderSettings(){const h=settingsHTML();$('#t-set').innerHTML=h;$('#setbody').innerHTML=h}
function assign(code){const {a,s}=rebind;rebind=null;
  if(code)for(const k in BIND)BIND[k]=BIND[k].map((c,i)=>(c===code&&!(k===a&&i===s))?'':c);
  BIND[a][s]=code;saveKeys();renderSettings();updateHelp();lastIn=''}
function openSettings(){setOpen=true;for(const k in K)K[k]=0;sendIn();rebind=null;renderSettings();$('#setov').style.display='flex'}
function closeSettings(){setOpen=false;rebind=null;$('#setov').style.display='none';renderSettings()}
document.addEventListener('click',e=>{const t=e.target.closest?e.target:e.target.parentElement;if(!t)return;
  const b=t.closest('.kb');if(b){rebind={a:b.dataset.a,s:+b.dataset.s};renderSettings();return}
  if(t.closest('.fsbtn')){toggleFull();return}
  if(t.closest('.rstkeys')){BIND=cloneKeys(KDEF);rebind=null;saveKeys();renderSettings();updateHelp();return}});
const fsUpdate=()=>{$('#fsb2').textContent=isFull()?'Quitter plein écran':'Plein écran';renderSettings()};
document.addEventListener('fullscreenchange',fsUpdate);document.addEventListener('webkitfullscreenchange',fsUpdate);

/* ---------- son ---------- */
function tone(f,d,type='sine',v=.07,f2=0){if(!actx)return;const o=actx.createOscillator(),a=actx.createGain(),t=actx.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(actx.destination);o.start(t);o.stop(t+d)}
function toast(s){const t=$('#toast');t.textContent=s;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)}
function audio(){actx=actx||new (window.AudioContext||window.webkitAudioContext)()}

/* ---------- scène Three.js ---------- */
const renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b1f);scene.fog=new THREE.Fog(0x070b1f,150,420);
const camera=new THREE.PerspectiveCamera(78,1,0.5,600);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xbbd4ff,0x223344,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(30,70,20);scene.add(sun);
const ballLight=new THREE.PointLight(0xffffff,0.7,40);scene.add(ballLight);
function ctex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}

/* ---------- arène (reconstruite selon les dimensions du serveur) ---------- */
const arenaG=new THREE.Group();scene.add(arenaG);
let spec=null;
function clearG(g){while(g.children.length){const c=g.children[0];g.remove(c);c.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose()}if(o.isInstancedMesh&&o.dispose)o.dispose()})}spec=null}
function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}
function rrShape(w,h,r){const s=new THREE.Shape(),x=w/2,y=h/2;
  if(r<=.01){s.moveTo(-x,-y);s.lineTo(x,-y);s.lineTo(x,y);s.lineTo(-x,y);s.closePath();return s}
  s.moveTo(-x+r,-y);s.lineTo(x-r,-y);s.absarc(x-r,-y+r,r,-Math.PI/2,0,false);s.lineTo(x,y-r);s.absarc(x-r,y-r,r,0,Math.PI/2,false);
  s.lineTo(-x+r,y);s.absarc(-x+r,y-r,r,Math.PI/2,Math.PI,false);s.lineTo(-x,-y+r);s.absarc(-x+r,-y+r,r,Math.PI,Math.PI*1.5,false);s.closePath();return s}
const wallMat=c=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false});
function panel(w,h,x,y,z,ry,col){const g=new THREE.PlaneGeometry(w,h),m=new THREE.Mesh(g,wallMat(col));m.position.set(x,y,z);m.rotation.y=ry;arenaG.add(m);
  const l=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:col}));l.position.copy(m.position);l.rotation.copy(m.rotation);arenaG.add(l)}
function mouthShape(){const sh=new THREE.Shape(),w=GW/2;
  if(GR<=.01){sh.moveTo(-w,0);sh.lineTo(w,0);sh.lineTo(w,GH);sh.lineTo(-w,GH);sh.closePath();return sh}
  sh.moveTo(-w,0);sh.lineTo(w,0);sh.lineTo(w,GH-GR);sh.absarc(w-GR,GH-GR,GR,0,Math.PI/2,false);sh.lineTo(-w+GR,GH);sh.absarc(-w+GR,GH-GR,GR,Math.PI/2,Math.PI,false);sh.closePath();return sh}
function buildArena(){
  clearG(arenaG);const hw=AW/2,hl=AL/2,R=CR;
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(800,800),new THREE.MeshBasicMaterial({color:0x050818}));ground.rotation.x=-Math.PI/2;ground.position.y=-.12;arenaG.add(ground);
  // sol (8 px par unité), bordure arrondie comme les murs
  const S=8,tex=ctex(AW*S,AL*S,(x,w,h)=>{
    const n=12;for(let i=0;i<n;i++){x.fillStyle=i%2?'#0f6b4a':'#118052';x.fillRect(0,i*h/n,w,h/n+1)}
    let gr=x.createLinearGradient(0,0,0,22*S);gr.addColorStop(0,'rgba(56,163,255,.55)');gr.addColorStop(1,'rgba(56,163,255,0)');x.fillStyle=gr;x.fillRect(0,0,w,22*S);
    gr=x.createLinearGradient(0,h,0,h-22*S);gr.addColorStop(0,'rgba(255,138,31,.55)');gr.addColorStop(1,'rgba(255,138,31,0)');x.fillStyle=gr;x.fillRect(0,h-22*S,w,22*S);
    x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=5;rr(x,3,3,w-6,h-6,R*S);x.stroke();
    x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();x.beginPath();x.arc(w/2,h/2,14*S,0,7);x.stroke();
    x.strokeRect(w/2-20*S,0,40*S,19*S);x.strokeRect(w/2-20*S,h-19*S,40*S,19*S)});
  const fg=new THREE.ShapeGeometry(rrShape(AW,AL,R),24),pa=fg.attributes.position,uv=fg.attributes.uv;
  for(let i=0;i<pa.count;i++)uv.setXY(i,(pa.getX(i)+hw)/AW,(pa.getY(i)+hl)/AL);uv.needsUpdate=true;
  const floor=new THREE.Mesh(fg,new THREE.MeshStandardMaterial({map:tex,roughness:.85}));floor.rotation.x=-Math.PI/2;arenaG.add(floor);
  // murs latéraux
  panel(AL-2*R,AH,-hw,AH/2,0,Math.PI/2,0x4a7bd0);panel(AL-2*R,AH,hw,AH/2,0,Math.PI/2,0x4a7bd0);

    flash(m.x,m.y+.5,m.z);tone(90,.5,'sawtooth',.12,30);tone(300,.25,'square',.06,60);
    shake=Math.max(shake,(m.v===myId||m.by===myId)?1.2:.5);cheer=Math.max(cheer,.4);
    const by=roster[m.by],vi=roster[m.v];if(by&&vi)toast('💥 '+by.n+' a démoli '+vi.n)},
  res(m){lastRes=m},
  back(){toLobby()},
  pong(m){ping=Math.round(performance.now()-m.ts);$('#ping').textContent=ping+' ms'},
  err(m){$('#err').textContent=m.m;$('#go').disabled=false}
};
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{$('#conn').textContent='Connexion…';send({t:'hello',tok,n:$('#name').value.trim()});clearInterval(pingT);pingT=setInterval(()=>send({t:'ping',ts:performance.now()}),2000)};
  ws.onmessage=e=>{const m=JSON.parse(e.data);H_[m.t]&&H_[m.t](m)};
  ws.onclose=()=>{ready=false;clearInterval(pingT);['#go','#r1','#r2'].forEach(s=>$(s).disabled=true);$('#conn').textContent='Connexion perdue… nouvelle tentative';
    if(joined)toLobby();setTimeout(connect,2000)};
}
function curName(){const n=$('#name').value.trim()||(PROF&&PROF.name)||'Joueur';return n}
$('#go').onclick=()=>{audio();$('#err').textContent='';$('#go').disabled=true;send({t:'join',n:curName(),r:$('#room').value.trim(),c:myCar})};
$('#r1').onclick=()=>{audio();send({t:'queue',pl:1,n:curName(),c:myCar})};$('#r2').onclick=()=>{audio();send({t:'queue',pl:2,n:curName(),c:myCar})};
$('#qc').onclick=()=>send({t:'unq'});
$('#room').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});

$('#copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.origin+'/?room='+room).then(()=>toast('Lien copié !'),()=>toast(location.href))};
$('#addbot').onclick=()=>send({t:'bot',a:1});$('#rmbot').onclick=()=>send({t:'bot',a:-1});$('#team').onclick=()=>send({t:'team'});
$('#leave').onclick=()=>{if(ranked&&!confirm('Quitter une partie classée compte comme une défaite. Quitter ?'))return;send({t:'leave'})};
$('#setb').onclick=openSettings;$('#setx').onclick=closeSettings;
document.querySelectorAll('#bar button').forEach(b=>b.addEventListener('click',()=>b.blur()));

/* ---------- entrées (touches physiques, configurables) ---------- */
const K={};
const dn=a=>BIND[a].some(c=>c&&K[c]);
function sendIn(){if(!joined)return;const z=setOpen;
  const i={t:'in',w:+(!z&&dn('fwd')),s:+(!z&&dn('back')),a:+(!z&&dn('left')),d:+(!z&&dn('right')),j:+(!z&&dn('jump')),b:+(!z&&dn('boost')),q:+(!z&&dn('rollL')),e:+(!z&&dn('rollR')),h:+(!z&&dn('drift'))};
  const s=JSON.stringify(i);if(s!==lastIn){lastIn=s;ws.send(s)}}
addEventListener('keydown',e=>{
  if(rebind){e.preventDefault();if(e.repeat)return;
    if(e.code==='Escape'){rebind=null;renderSettings();return}
    if(e.code==='Backspace'||e.code==='Delete'){assign('');return}
    assign(norm(e.code));return}
  if(setOpen){if(e.code==='Escape')closeSettings();return}
  if(!joined)return;const c=norm(e.code);
  if(isBound(c)||e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();
  if(!e.repeat){const A=a=>BIND[a].includes(c);
    if(!ranked){if(A('addbot'))send({t:'bot',a:1});if(A('rmbot'))send({t:'bot',a:-1});if(A('team'))send({t:'team'})}
    if(A('cam')){ballCam=!ballCam;toast(ballCam?'Caméra : balle':'Caméra : voiture')}
    if(A('full'))toggleFull()}
  K[c]=1;sendIn()});
addEventListener('keyup',e=>{K[norm(e.code)]=0;sendIn()});
addEventListener('blur',()=>{for(const k in K)K[k]=0;sendIn()});
addEventListener('mousedown',e=>{ // capture d'un bouton de souris pendant le changement de touche
  if(!rebind)return;if(e.target.closest&&e.target.closest('button,input'))return;e.preventDefault();assign('Mouse'+e.button)},true);
$('#gl').addEventListener('mousedown',e=>{if(!joined||setOpen)return;if(e.button===1)e.preventDefault();K['Mouse'+e.button]=1;sendIn()});
addEventListener('mouseup',e=>{K['Mouse'+e.button]=0;sendIn()});
addEventListener('contextmenu',e=>{if(joined||rebind)e.preventDefault()});
try{if(navigator.keyboard&&navigator.keyboard.getLayoutMap)navigator.keyboard.getLayoutMap().then(m=>{LAYOUT=m;updateHelp();renderSettings()}).catch(()=>{})}catch(e){}
updateHelp();renderSettings();

/* ---------- interpolation ---------- */
function view(){
  if(!snaps.length)return null;
  const now=performance.now()-100;let i=snaps.length-1;while(i>0&&snaps[i].rt>now)i--;
  const a=snaps[i],b=snaps[i+1];if(!b||a.rt>now)return a;
  const f=clamp((now-a.rt)/(b.rt-a.rt),0,1),L=(p,q)=>p+(q-p)*f;
  const bl=Math.hypot(b.b[0]-a.b[0],b.b[1]-a.b[1],b.b[2]-a.b[2])>20?b.b:[L(a.b[0],b.b[0]),L(a.b[1],b.b[1]),L(a.b[2],b.b[2])];
  const am={};a.c.forEach(c=>am[c[0]]=c);
  const cs=b.c.map(c=>{const p=am[c[0]];if(!p||Math.hypot(c[1]-p[1],c[2]-p[2],c[3]-p[3])>20)return c;
    return[c[0],L(p[1],c[1]),L(p[2],c[2]),L(p[3],c[3]),p[4]+wrap(c[4]-p[4])*f,L(p[5],c[5]),p[6]+wrap(c[6]-p[6])*f,c[7],c[8],Math.abs(c[9]-p[9])>3?c[9]:L(p[9],c[9]),Math.abs(c[10]-p[10])>3?c[10]:L(p[10],c[10])]});
  return{...b,b:bl,c:cs};
}

/* ---------- caméra façon Rocket League ---------- */
let fov=78;const camDir=new THREE.Vector3(0,0,1),camPos=new THREE.Vector3(0,20,-60);
function cornerClamp(v,m){if(CR<=0)return;const cx=AW/2-CR,cz=AL/2-CR,ax=Math.abs(v.x),az=Math.abs(v.z);if(ax<=cx||az<=cz)return;
  const dx=ax-cx,dz=az-cz,d=Math.hypot(dx,dz),lim=CR-m;if(lim>0&&d>lim){v.x=Math.sign(v.x)*(cx+dx*lim/d);v.z=Math.sign(v.z)*(cz+dz*lim/d)}}
function updateCam(S,dt){
  const me=S.c.find(c=>c[0]===myId);
  if(!me){camera.position.set(0,50,-95);camera.lookAt(0,0,0);return}
  const tf=(me[8]&1)?88:78;fov+=(tf-fov)*Math.min(1,dt*6);if(Math.abs(camera.fov-fov)>.05){camera.fov=fov;camera.updateProjectionMatrix()}
  const cp=new THREE.Vector3(me[1],me[2],me[3]),bp=new THREE.Vector3(S.b[0],S.b[1],S.b[2]);
  const fwd=new THREE.Vector3(Math.sin(me[4]),0,Math.cos(me[4]));
  const dir=ballCam?bp.clone().sub(cp):fwd.clone();dir.y=0;if(dir.lengthSq()<1)dir.copy(fwd);dir.normalize();
  camDir.lerp(dir,1-Math.exp(-dt*7)).normalize();
  const want=cp.clone().addScaledVector(camDir,-14);want.y=cp.y+6+(ballCam?clamp(bp.y*.25,0,5):0);
  want.x=clamp(want.x,-AW/2+2,AW/2-2);want.z=clamp(want.z,-AL/2-GD+2,AL/2+GD-2);want.y=clamp(want.y,2.5,AH-2);cornerClamp(want,2);
  camPos.lerp(want,1-Math.exp(-dt*9));camera.position.copy(camPos);
  if(shake>.01){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;shake*=.9}
  const look=ballCam?cp.clone().lerp(bp,.6):cp.clone().addScaledVector(camDir,14);look.y+=1.2;camera.lookAt(look);
}

/* ---------- boucle de rendu ---------- */
let lastT=performance.now(),pb=null;
const _ax=new THREE.Vector3();
function fmt(t){return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function frame(t){
  requestAnimationFrame(frame);const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  if(!joined){ // menu : salle d'exposition
    if(showCar)showCar.rotation.y+=dt*.7;
    camera.position.set(500,3.4,10.5);camera.lookAt(496.5,1,0);updP(dt);updFlash(dt);renderer.render(scene,camera);return}
  specT+=dt;cheer=Math.max(0,cheer-dt*.45);if(cheer>.02||((specF++)&3)===0)animSpec(.05+cheer*1.0);
  const S=view();if(!S){renderer.render(scene,camera);return}
  if(pb){const dx=S.b[0]-pb[0],dz=S.b[2]-pb[2],d=Math.hypot(dx,dz);if(d>1e-4&&d<5){_ax.set(dz,0,-dx).normalize();ball.rotateOnWorldAxis(_ax,d/BR)}}
  pb=S.b;ball.position.set(S.b[0],S.b[1],S.b[2]);ballLight.position.set(S.b[0],S.b[1]+4,S.b[2]);
  ballShadow.position.x=S.b[0];ballShadow.position.z=S.b[2];ballShadow.scale.setScalar(BR*Math.max(.4,1-S.b[1]/40));
  padMeshes.forEach((m,i)=>{m.material.opacity=S.p[i]==='1'?1:.18});
  const seen={};
  S.c.forEach(c=>{const o=ensureCar(c[0]);if(!o)return;seen[c[0]]=1;
    const dead=!!(c[8]&16);o.mesh.visible=!dead;o.label.visible=!dead;o.shadow.visible=!dead;
    o.mesh.position.set(c[1],c[2],c[3]);o.mesh.rotation.set(c[5]+c[9],c[4],c[6]+c[10],'YXZ');
    o.label.position.set(c[1],c[2]+3.2,c[3]);o.shadow.position.x=c[1];o.shadow.position.z=c[3];o.shadow.scale.setScalar(2*Math.max(.4,1-c[2]/30));
    const fl=!!(c[8]&1)&&!dead;o.mesh.userData.flame.visible=fl;
    if(fl){const fx=Math.sin(c[4])*Math.cos(c[5]),fy=-Math.sin(c[5]),fz=Math.cos(c[4])*Math.cos(c[5]);
      for(let k=0;k<2;k++)spawn(c[1]-fx*2.2,c[2]-fy*2.2,c[3]-fz*2.2,-fx*(8+Math.random()*6)+(Math.random()-.5)*2,-fy*8+(Math.random()-.5)*2,-fz*(8+Math.random()*6)+(Math.random()-.5)*2,.35,{r:1,g:.55+Math.random()*.3,b:.1})}
    if((c[8]&8)&&!dead){const fx=Math.sin(c[4]),fz=Math.cos(c[4]);for(const sd of[-1,1])spawn(c[1]-fx*1.3+fz*sd,c[2]-.4,c[3]-fz*1.3-fx*sd,(Math.random()-.5)*2,1+Math.random()*2,(Math.random()-.5)*2,.6,{r:.55,g:.55,b:.6})}
  });
  for(const id in cars)if(!seen[id]){scene.remove(cars[id].mesh,cars[id].label,cars[id].shadow);delete cars[id]}
  updP(dt);updFlash(dt);updateCam(S,dt);renderer.render(scene,camera);hud(S,t);
}
function hud(S,t){
  $('#s0').textContent=S.sc[0];$('#s1').textContent=S.sc[1];$('#tm').textContent=(S.ot?'+':'')+fmt(S.tm);
  const me=S.c.find(c=>c[0]===myId);if(me){$('#boost').style.setProperty('--p',me[7]);$('#bv').textContent=me[7]}
  let k='',h='';
  if(S.st==='wait'){k='w';h='En attente d\'un adversaire…<small>Copie le lien pour inviter un ami, ou appuie sur '+KL('addbot')+' pour ajouter un bot</small>'}
  else if(S.st==='count'){k='c'+S.cd;h=S.cd>0?S.cd:'GO !'}
  else if(S.st==='over'){const w=S.w>=0?S.w:(S.sc[0]>S.sc[1]?0:1),mine=(roster[myId]||{tm:0}).tm===w;k='o'+w+mine+(lastRes?1:0);
    let sub=S.sc[0]+' - '+S.sc[1];
    if(lastRes)sub+=` · ${lastRes.delta>=0?'+':''}${lastRes.delta} MMR · ${lastRes.after.label}`+(lastRes.place<5?` (placement ${lastRes.place}/5)`:'');
    h=`<span style="color:${TC[w]}">${mine?'VICTOIRE !':'DÉFAITE'}</span><small>${sub}</small>`}
  else if(banner&&t-banner.t<2600){k='b'+banner.t;h=`<span style="color:${banner.col}">${banner.txt}</span>`}
  else if(me&&(me[8]&16)){k='dm';h='<span style="font-size:.45em;color:#ff5a5a">DÉMOLI</span><small>Réapparition…</small>'}
  else if(S.ot){k='ot';h='<small style="margin:0;color:#ffd24a">PROLONGATION · but en or</small>';$('#msg').style.top='12%'}
  if(k!==msgKey){msgKey=k;$('#msg').innerHTML=h;if(k!=='ot')$('#msg').style.top='28%'}
}
connect();setShow('octane');
requestAnimationFrame(frame);
</script></body></html>
