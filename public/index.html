<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pouket League 3D</title>
<style>
:root{--bg:#070b1f;--fg:#eef1ff;--blue:#38a3ff;--org:#ff8a1f;--panel:#141b3d;--line:#2b3a7a}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button,input{font:inherit;color:var(--fg);border-radius:10px;border:2px solid var(--line);background:var(--panel);padding:10px 14px}
button{cursor:pointer;background:#243063}button:hover:not(:disabled){background:#2f3f85}button:disabled{opacity:.45;cursor:default}
/* lobby */
#lobby{position:fixed;inset:0;z-index:10;display:flex;background:linear-gradient(90deg,#070b1ff5 0%,#070b1fe8 42%,#070b1f00 78%);overflow:auto}
#lcol{width:min(500px,94vw);padding:22px 26px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
h1{font:900 clamp(30px,5vw,54px)/1 "Arial Black",Impact,sans-serif;margin:0;letter-spacing:-1px;background:linear-gradient(90deg,var(--blue),#fff,var(--org));-webkit-background-clip:text;background-clip:text;color:transparent}
#conn{font-size:12px;opacity:.7;min-height:1.2em}
#tabs{display:flex;gap:6px}#tabs button{flex:1;padding:8px}#tabs button.on{background:linear-gradient(90deg,#1f7bd6,#6a4fd6);border-color:#6a8aff}
.tab{display:none;flex-direction:column;gap:10px}.tab.on{display:flex}
label{font-size:13px;opacity:.75;margin-top:4px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
#cars{display:flex;gap:8px}
.card{flex:1;text-align:center;padding:10px 6px;border-radius:12px;border:2px solid var(--line);background:var(--panel);cursor:pointer}
.card.on{border-color:#ffd24a;background:#1f2a5e}.card b{display:block}.card small{opacity:.7;font-size:11px}
#cdesc{font-size:13px;opacity:.8;min-height:1.3em}
.rk{display:flex;justify-content:space-between;align-items:center;font-weight:700;background:linear-gradient(90deg,#7a2fd6,#d6327a);border:0;padding:13px 16px}
.rk small{font-weight:500;opacity:.9}
#go{font-weight:700;background:linear-gradient(90deg,#1f7bd6,#e06f0b);border:0}
#err{color:#ff7a7a;min-height:1.2em;margin:0}
.hint{opacity:.65;font-size:12px;line-height:1.5;margin:0}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:13px;color:#10142c;background:var(--c,#999)}
.pcard{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px}
.phead{display:flex;gap:12px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:900 24px "Arial Black",sans-serif;color:#10142c;background:linear-gradient(135deg,#ffd24a,#ff8a1f)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.grid b{display:block;font-size:20px}.grid small{opacity:.65;font-size:11px}
.bar{height:6px;border-radius:4px;background:#ffffff22;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,#ffd24a)}
.rkrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist{font-size:13px;display:flex;flex-direction:column;gap:3px}.hist span.w{color:#6dff9c}.hist span.l{color:#ff7a7a}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px 6px;border-bottom:1px solid #ffffff14}tr.me td{background:#ffd24a22}
#lbt{display:flex;gap:6px}#lbt button{flex:1;padding:6px}#lbt button.on{background:#6a4fd6}
#queue{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#070b1fd9}
#qt{font:900 34px "Arial Black",sans-serif}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#score{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#000a;padding:6px 18px;border-radius:12px}
#score b{font:900 40px "Arial Black",sans-serif;min-width:34px;text-align:center}
#s0{color:var(--blue)}#s1{color:var(--org)}#tm{font:bold 22px system-ui;min-width:70px;text-align:center}
#roster{position:absolute;top:12px;left:14px;font-size:14px;line-height:1.5;text-shadow:0 1px 3px #000}
#roster small{opacity:.7;margin-left:4px;font-size:11px}
#mode{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:2px;color:#ffd24a;text-shadow:0 1px 3px #000}
#ping{position:absolute;bottom:10px;left:14px;font-size:12px;opacity:.7}
#boost{--p:0;position:absolute;right:28px;bottom:28px;width:110px;height:110px;border-radius:50%;background:conic-gradient(#ffd24a calc(var(--p)*1%),#ffffff22 0);display:grid;place-items:center}
#boost::before{content:"";position:absolute;inset:10px;border-radius:50%;background:#0a0f24ee}
#bv{position:relative;font:900 30px "Arial Black",sans-serif;font-style:normal}
#msg{position:absolute;top:28%;left:0;right:0;text-align:center;font:900 clamp(40px,9vw,110px)/1.1 "Arial Black",sans-serif;text-shadow:0 4px 16px #000}
#msg small{display:block;font:600 clamp(14px,2vw,24px) system-ui;margin-top:12px;color:#fff}
#bar{position:absolute;top:10px;right:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;font-size:13px;pointer-events:auto;max-width:42vw}
#bar button{padding:6px 10px;font-size:12px}#rc{font-weight:700;letter-spacing:2px;color:#ffd24a}
#help{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.65;white-space:nowrap}
#toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
</style></head><body>
<canvas id="gl"></canvas>
<div id="lobby"><div id="lcol">
  <h1>POUKET LEAGUE 3D</h1><div id="conn">Connexion au serveur…</div>
  <div id="tabs"><button data-tab="play" class="on">Jouer</button><button data-tab="prof">Profil</button><button data-tab="lb">Classement</button></div>
  <div class="tab on" id="t-play">
    <label>Pseudo</label><input id="name" maxlength="14" placeholder="Ton pseudo" autocomplete="off">
    <label>Voiture</label><div id="cars"></div><div id="cdesc"></div>
    <label>Parties classées</label>
    <button class="rk" id="r1" disabled><span>Classé 1v1</span><small id="r1r"></small></button>
    <button class="rk" id="r2" disabled><span>Classé 2v2</span><small id="r2r"></small></button>
    <label>Partie libre</label>
    <div class="row"><input id="room" maxlength="6" placeholder="Code du salon (vide = nouveau)" autocomplete="off"><button id="go" disabled>Jouer</button></div>
    <p id="err"></p>
    <p class="hint">Z/S avancer, reculer · Q/D tourner · Espace saut (2e appui + direction = dash) · Maj ou clic droit turbo · A/E rouler en l'air · C caméra balle/voiture</p>
  </div>
  <div class="tab" id="t-prof"></div>
  <div class="tab" id="t-lb"></div>
</div></div>
<div id="queue"><div id="qt">Recherche d'une partie…</div><div id="qs" style="opacity:.8"></div><button id="qc">Annuler</button></div>
<div id="hud">
  <div id="score"><b id="s0">0</b><span id="tm">3:00</span><b id="s1">0</b></div>
  <div id="roster"></div><div id="mode"></div><div id="ping"></div>
  <div id="boost"><i id="bv">0</i></div><div id="msg"></div>
  <div id="bar"><span id="rc"></span><button id="copy">Copier le lien</button><button id="addbot">+ Bot</button><button id="rmbot">− Bot</button><button id="team">Équipe</button><button id="leave">Quitter</button></div>
  <div id="help">Saut : Espace · Turbo : Maj / clic droit · Caméra : C</div>
</div>
<div id="toast"></div>
<script src="/vendor/three.min.js"></script>
<script>
const AW=80,AL=120,AH=32,GW=16,GH=8,GD=8,BR=2;
const TC=['#38a3ff','#ff8a1f'],TCN=[0x38a3ff,0xff8a1f];
const CARINFO={octane:['Octane','Polyvalente · hitbox équilibrée'],fennec:['Fennec','Carrée et haute · large zone de contact'],dominus:['Dominus','Basse et longue · frappes à plat']};
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrap=d=>{d%=6.28319;if(d>3.14159)d-=6.28319;if(d<-3.14159)d+=6.28319;return d};
const hex=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('');
let ws,ready=false,PROF=null,myCar='octane',myId=0,room='',ranked=0,plist=0,roster={},snaps=[],ping=0,joined=false,lastIn='',actx=null,ballCam=true,shake=0,banner=null,lastCd=-1,msgKey='',lastRes=null,qStart=0,qTimer=0,pingT=0;
let tok='';try{tok=localStorage.getItem('pl_tok')||'';if(!/^[a-f0-9]{32}$/.test(tok)){tok=hex(16);localStorage.setItem('pl_tok',tok)}}catch(e){tok=hex(16)}

/* ---------- son ---------- */
function tone(f,d,type='sine',v=.07,f2=0){if(!actx)return;const o=actx.createOscillator(),a=actx.createGain(),t=actx.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(actx.destination);o.start(t);o.stop(t+d)}
function toast(s){const t=$('#toast');t.textContent=s;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)}
function audio(){actx=actx||new (window.AudioContext||window.webkitAudioContext)()}

/* ---------- scène Three.js ---------- */
const renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b1f);scene.fog=new THREE.Fog(0x070b1f,110,300);
const camera=new THREE.PerspectiveCamera(78,1,0.5,600);
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xbbd4ff,0x223344,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(30,70,20);scene.add(sun);
const ballLight=new THREE.PointLight(0xffffff,0.7,40);scene.add(ballLight);
function ctex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
const floorTex=ctex(640,960,(x,w,h)=>{
  for(let i=0;i<12;i++){x.fillStyle=i%2?'#0f6b4a':'#118052';x.fillRect(0,i*80,w,80)}
  let gr=x.createLinearGradient(0,0,0,170);gr.addColorStop(0,'rgba(56,163,255,.55)');gr.addColorStop(1,'rgba(56,163,255,0)');x.fillStyle=gr;x.fillRect(0,0,w,170);
  gr=x.createLinearGradient(0,h,0,h-170);gr.addColorStop(0,'rgba(255,138,31,.55)');gr.addColorStop(1,'rgba(255,138,31,0)');x.fillStyle=gr;x.fillRect(0,h-170,w,170);
  x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=5;x.strokeRect(3,3,w-6,h-6);
  x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();x.beginPath();x.arc(w/2,h/2,110,0,7);x.stroke();
  x.strokeRect(w/2-160,0,320,150);x.strokeRect(w/2-160,h-150,320,150)});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(AW,AL),new THREE.MeshStandardMaterial({map:floorTex,roughness:.85}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const wallMat=c=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false});
function panel(w,h,x,y,z,ry,col){const g=new THREE.PlaneGeometry(w,h),m=new THREE.Mesh(g,wallMat(col));m.position.set(x,y,z);m.rotation.y=ry;scene.add(m);
  const l=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:col}));l.position.copy(m.position);l.rotation.copy(m.rotation);scene.add(l)}
panel(AL,AH,-AW/2,AH/2,0,Math.PI/2,0x4a7bd0);panel(AL,AH,AW/2,AH/2,0,Math.PI/2,0x4a7bd0);
for(const s of[-1,1]){const col=s<0?TCN[0]:TCN[1],z=s*AL/2,sw=(AW-GW)/2;
  panel(sw,AH,-(GW/2+sw/2),AH/2,z,0,col);panel(sw,AH,GW/2+sw/2,AH/2,z,0,col);panel(GW,AH-GH,0,GH+(AH-GH)/2,z,0,col);
  const gb=new THREE.BoxGeometry(GW,GH,GD),gm=new THREE.Mesh(gb,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.14,side:THREE.BackSide,depthWrite:false}));
  gm.position.set(0,GH/2,s*(AL/2+GD/2));scene.add(gm);
  const ge=new THREE.LineSegments(new THREE.EdgesGeometry(gb),new THREE.LineBasicMaterial({color:col}));ge.position.copy(gm.position);scene.add(ge);
  const gl=new THREE.PointLight(col,0.9,40);gl.position.set(0,GH/2,s*(AL/2+2));scene.add(gl)}
const crowd=ctex(512,128,(x,w,h)=>{x.fillStyle='#0b1030';x.fillRect(0,0,w,h);let s=11;const r=()=>(s=s*16807%2147483647)/2147483647;
  for(let i=0;i<1400;i++){x.fillStyle=`hsl(${r()*360|0},70%,${45+r()*25|0}%)`;x.fillRect(r()*w,r()*h,3,3)}});
function stand(w,x,z,ry){const t=crowd.clone();t.needsUpdate=true;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(w/40,1);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,50),new THREE.MeshBasicMaterial({map:t,color:0xaaaaaa,fog:true}));m.position.set(x,25,z);m.rotation.y=ry;scene.add(m)}
stand(AL+60,-AW/2-22,0,Math.PI/2);stand(AL+60,AW/2+22,0,-Math.PI/2);stand(AW+60,0,-AL/2-30,0);stand(AW+60,0,AL/2+30,Math.PI);
const ballTex=ctex(256,128,(x,w,h)=>{x.fillStyle='#f4f6ff';x.fillRect(0,0,w,h);x.fillStyle='#1b2140';let s=5;const r=()=>(s=s*16807%2147483647)/2147483647;
  for(let i=0;i<14;i++){x.beginPath();x.arc(r()*w,r()*h,10+r()*8,0,7);x.fill()}});
const ball=new THREE.Mesh(new THREE.SphereGeometry(BR,32,24),new THREE.MeshStandardMaterial({map:ballTex,roughness:.35,emissive:0x333344}));scene.add(ball);
const shadowGeo=new THREE.CircleGeometry(1,20),shadowMat=new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.35,depthWrite:false});
function mkShadow(){const m=new THREE.Mesh(shadowGeo,shadowMat);m.rotation.x=-Math.PI/2;m.position.y=.04;scene.add(m);return m}
const ballShadow=mkShadow();
let padMeshes=[];
function buildPads(list){padMeshes.forEach(m=>scene.remove(m));padMeshes=list.map(([x,z,a])=>{const big=a>=100;
  const m=new THREE.Mesh(new THREE.CylinderGeometry(big?2.4:1.2,big?2.4:1.2,.12,24),new THREE.MeshBasicMaterial({color:big?0xffd24a:0x7ff3ff,transparent:true}));m.position.set(x,.08,z);scene.add(m);return m})}

/* ---------- voitures : Octane, Fennec, Dominus ---------- */
const CARH={octane:1.8,fennec:1.7,dominus:1.95};
function mk(w,h,d,x,y,z,mat,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);parent.add(m);return m}
function buildCar(team,type){
  const gp=new THREE.Group(),col=TCN[team];
  const P=new THREE.MeshStandardMaterial({color:col,roughness:.4,metalness:.3,emissive:col,emissiveIntensity:.2});
  const D=new THREE.MeshStandardMaterial({color:0x10151f,roughness:.3,metalness:.5});
  const G=new THREE.MeshStandardMaterial({color:0x1a2540,roughness:.15,metalness:.7});
  const WH=new THREE.MeshStandardMaterial({color:0x0b0d14}),LT=new THREE.MeshBasicMaterial({color:0xffffff}),RT=new THREE.MeshBasicMaterial({color:0xff3030});
  let wr=.45,wz=1.15,wx=1.0,ww=.4;
  if(type==='fennec'){wr=.5;wz=1.1;wx=1.03;
    mk(2.1,.62,3.2,0,-.05,0,P,gp);mk(1.8,.6,1.5,0,.55,-.1,P,gp);mk(1.84,.3,1.2,0,.6,-.1,G,gp);mk(1.5,.06,1.0,0,.9,-.1,D,gp);
    [-1.06,1.06].forEach(x=>mk(.08,.2,2.2,x,-.22,0,D,gp));mk(2.0,.25,.15,0,-.2,1.62,D,gp);mk(2.0,.25,.15,0,-.2,-1.62,D,gp);
    [-.65,.65].forEach(x=>{mk(.5,.25,.1,x,.1,1.62,LT,gp);mk(.5,.2,.1,x,.1,-1.62,RT,gp)})}
  else if(type==='dominus'){wr=.42;wz=1.35;ww=.5;
    mk(2.0,.38,3.9,0,-.08,0,P,gp);mk(1.9,.2,1.4,0,.08,1.2,P,gp);mk(1.3,.3,1.3,0,.28,-.5,G,gp);mk(1.2,.06,1.0,0,.45,-.5,P,gp);
    mk(2.2,.06,.7,0,.42,-1.85,D,gp);[-1.1,1.1].forEach(x=>mk(.06,.25,.7,x,.5,-1.85,D,gp));[-.6,.6].forEach(x=>mk(.08,.3,.08,x,.25,-1.7,D,gp));
    mk(2.1,.07,.5,0,-.3,1.95,D,gp);mk(1.4,.1,.08,0,0,1.93,LT,gp);mk(1.4,.1,.08,0,0,-1.93,RT,gp)}
  else{
    mk(2,.5,3.5,0,-.1,0,P,gp);mk(1.5,.45,1.5,0,.4,-.35,G,gp);mk(1.4,.08,1.2,0,.66,-.35,P,gp);
    mk(1.9,.07,.45,0,.5,-1.65,D,gp);[-.6,.6].forEach(x=>mk(.1,.3,.1,x,.33,-1.6,D,gp));mk(2.0,.08,.4,0,-.38,1.8,D,gp);
    [-.65,.65].forEach(x=>{mk(.4,.18,.1,x,0,1.76,LT,gp);mk(.5,.15,.1,x,0,-1.76,RT,gp)})}
  [[-1,1],[1,1],[-1,-1],[1,-1]].forEach(([sx,sz])=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(wr,wr,ww,16),WH);w.rotation.z=Math.PI/2;w.position.set(sx*wx,-.3,sz*wz);gp.add(w)});
  const fl=new THREE.Mesh(new THREE.ConeGeometry(.5,2.6,10),new THREE.MeshBasicMaterial({color:0xffb030,transparent:true,opacity:.9}));
  fl.rotation.x=-Math.PI/2;fl.position.set(0,0,-(CARH[type]||1.8)-1.3);fl.visible=false;gp.add(fl);gp.userData.flame=fl;return gp}
function labelSprite(txt,col){const t=ctex(256,64,(x,w,h)=>{x.font='bold 32px system-ui';x.textAlign='center';x.lineWidth=6;x.strokeStyle='#000c';x.strokeText(txt,w/2,44);x.fillStyle=col;x.fillText(txt,w/2,44)});
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));s.scale.set(8,2,1);s.renderOrder=10;return s}
const cars={};
function ensureCar(id){const r=roster[id];if(!r)return null;let c=cars[id];
  if(c&&(c.team!==r.tm||c.type!==r.c)){scene.remove(c.mesh,c.label,c.shadow);c=null}
  if(!c){c=cars[id]={team:r.tm,type:r.c,mesh:buildCar(r.tm,r.c),label:labelSprite((r.b?'🤖 ':'')+r.n,TC[r.tm]),shadow:mkShadow()};scene.add(c.mesh,c.label)}return c}

/* ---------- salle d'exposition (menu) ---------- */
const show=new THREE.Group();show.position.set(500,0,0);scene.add(show);
const disc=new THREE.Mesh(new THREE.CylinderGeometry(6,6,.3,48),new THREE.MeshStandardMaterial({color:0x10163a,roughness:.5,metalness:.4}));disc.position.y=-.2;show.add(disc);
const ring=new THREE.Mesh(new THREE.TorusGeometry(6,.08,8,64),new THREE.MeshBasicMaterial({color:0x38a3ff}));ring.rotation.x=Math.PI/2;ring.position.y=0;show.add(ring);
const showLight=new THREE.PointLight(0xffffff,1.1,40);showLight.position.set(500+4,7,7);scene.add(showLight);
let showCar=null;
function setShow(type){if(showCar)show.remove(showCar);showCar=buildCar(0,type);showCar.position.y=.7;showCar.rotation.y=2.4;show.add(showCar)}

/* ---------- particules ---------- */
const NP=900,ppos=new Float32Array(NP*3),pcol=new Float32Array(NP*3),pv=new Float32Array(NP*3),pl=new Float32Array(NP);
for(let i=0;i<NP;i++)ppos[i*3+1]=-100;
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(ppos,3));pg.setAttribute('color',new THREE.BufferAttribute(pcol,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.9,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));pts.frustumCulled=false;scene.add(pts);
let pIdx=0;
function spawn(x,y,z,vx,vy,vz,life,c){const i=pIdx++%NP;ppos.set([x,y,z],i*3);pv.set([vx,vy,vz],i*3);pcol.set([c.r,c.g,c.b],i*3);pl[i]=life}
function updP(dt){for(let i=0;i<NP;i++){if(pl[i]>0){pl[i]-=dt;ppos[i*3]+=pv[i*3]*dt;ppos[i*3+1]+=pv[i*3+1]*dt;ppos[i*3+2]+=pv[i*3+2]*dt;pv[i*3+1]-=9*dt;
  pcol[i*3]*=.97;pcol[i*3+1]*=.97;pcol[i*3+2]*=.97;if(pl[i]<=0)ppos[i*3+1]=-100}}pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true}

/* ---------- interface du menu ---------- */
const badge=r=>`<span class="badge" style="--c:${r.col}">${r.label}</span>`;
function setTab(n){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===n));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='t-'+n));if(n==='lb')askLb(lbPl);if(n==='prof')renderProfile()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function selectCar(t){myCar=t;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',c.dataset.c===t));$('#cdesc').textContent=CARINFO[t][1];setShow(t);send({t:'car',c:t})}
$('#cars').innerHTML=Object.keys(CARINFO).map(k=>`<div class="card" data-c="${k}"><b>${CARINFO[k][0]}</b><small>${k==='octane'?'Équilibrée':k==='fennec'?'Haute':'Basse'}</small></div>`).join('');
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>selectCar(c.dataset.c));
function plLine(p,k){const r=p.rank[k],n=p.place[k]||0;return n<5?`Placement ${n}/5 · ${r.label}`:`${r.label} · ${p.mmr[k]} MMR`}
function renderProfile(){const p=PROF;if(!p)return;
  $('#r1r').textContent=plLine(p,1);$('#r2r').textContent=plLine(p,2);
  const st=p.st,wr=st.m?Math.round(st.w/st.m*100):0,fav=Object.entries(p.cars).sort((a,b)=>b[1]-a[1])[0];
  const rk=k=>{const r=p.rank[k],n=p.place[k]||0,w=p.rw[k]||0;
    return `<div class="pcard" style="--c:${r.col}"><div class="rkrow"><b>${k===1?'1v1':'2v2'}</b>${badge(r)}<span>${p.mmr[k]} MMR</span></div>
      <div class="bar"><i style="width:${r.prog}%"></i></div><small style="opacity:.7">${n<5?`Placement ${n}/5 · `:''}${n} parties · ${w} victoires</small></div>`};
  const hist=p.hist.length?p.hist.map(h=>`<div><span class="${h.w?'w':'l'}">${h.w?'Victoire':'Défaite'}</span> ${h.pl}v${h.pl} vs ${h.opp||'?'} · ${h.d>0?'+':''}${h.d} MMR</div>`).join(''):'<small style="opacity:.6">Aucune partie classée pour le moment.</small>';
  $('#t-prof').innerHTML=`<div class="pcard"><div class="phead"><div class="avatar">${(p.name||'?')[0].toUpperCase()}</div><div><b style="font-size:20px">${p.name}</b><br><small style="opacity:.6">#${p.id}</small></div></div></div>
    <div class="pcard grid"><div><b>${st.m}</b><small>parties</small></div><div><b>${wr}%</b><small>victoires</small></div><div><b>${st.g}</b><small>buts</small></div><div><b>${st.best}</b><small>meilleure série</small></div></div>
    ${rk(1)}${rk(2)}<div class="pcard"><small style="opacity:.7">Voiture préférée</small><br><b>${fav?CARINFO[fav[0]][0]+' ('+fav[1]+' parties)':'—'}</b></div>
    <div class="pcard"><b>Dernières parties classées</b><div class="hist" style="margin-top:6px">${hist}</div></div>`}
let lbPl=1;
function askLb(pl){lbPl=pl;send({t:'lb',pl})}
function renderLb(m){const rows=m.rows.length?m.rows.map((r,i)=>`<tr class="${r.me?'me':''}"><td>${i+1}</td><td>${r.n}</td><td>${badge(r.r)}</td><td>${r.mmr}</td></tr>`).join(''):'<tr><td style="opacity:.6">Personne n\'est encore classé.</td></tr>';
  $('#t-lb').innerHTML=`<div id="lbt"><button data-p="1" class="${m.pl===1?'on':''}">1v1</button><button data-p="2" class="${m.pl===2?'on':''}">2v2</button></div><div class="pcard"><table>${rows}</table></div>`;
  document.querySelectorAll('#lbt button').forEach(b=>b.onclick=()=>askLb(+b.dataset.p))}

/* ---------- réseau ---------- */
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function startQueueUi(on,pl){clearInterval(qTimer);$('#queue').style.display=on?'flex':'none';if(on){qStart=Date.now();$('#qt').textContent='Recherche d\'une partie classée '+pl+'v'+pl+'…';
  qTimer=setInterval(()=>{const s=Math.floor((Date.now()-qStart)/1000);$('#qs').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' · la recherche s\'élargit avec le temps'},500);$('#qs').textContent='0:00'}}
function toLobby(){joined=false;snaps=[];for(const id in cars){scene.remove(cars[id].mesh,cars[id].label,cars[id].shadow);delete cars[id]}
  roster={};lastRes=null;banner=null;msgKey='';pb=null;for(const k in K)K[k]=0;lastIn='';$('#lobby').style.display='flex';$('#hud').style.display='none';startQueueUi(false);
  try{history.replaceState(null,'',location.pathname)}catch(e){}}
const H_={
  prof(m){PROF=m.p;const first=!ready;ready=true;$('#conn').textContent='Connecté';['#go','#r1','#r2'].forEach(s=>$(s).disabled=false);renderProfile();
    if(first){if(!$('#name').value)$('#name').value=PROF.name;selectCar(PROF.car in CARINFO?PROF.car:'octane')}},
  lb:renderLb,
  q(m){startQueueUi(!!m.s,m.pl)},
  w(m){myId=m.id;room=m.room;ranked=m.ranked;plist=m.pl;joined=true;pb=null;startQueueUi(false);buildPads(m.pads);
    $('#lobby').style.display='none';$('#hud').style.display='block';$('#rc').textContent=ranked?'':'Salon '+room;
    ['#copy','#addbot','#rmbot','#team'].forEach(s=>$(s).style.display=ranked?'none':'');$('#mode').textContent=ranked?'CLASSÉ '+plist+'v'+plist:'';
    if(!ranked)try{history.replaceState(null,'','?room='+room)}catch(e){}},
  r(m){roster={};m.pl.forEach(p=>roster[p.id]=p);
    $('#roster').innerHTML=m.pl.map(p=>`<div style="color:${TC[p.tm]}">${p.b?'🤖 ':''}${p.n}${p.id===myId?' (toi)':''}<small>${p.k||''}</small></div>`).join('')},
  s(m){m.rt=performance.now();snaps.push(m);if(snaps.length>30)snaps.shift();
    if(m.st==='count'&&m.cd!==lastCd){lastCd=m.cd;tone(m.cd>0?660:990,m.cd>0?.12:.3,'triangle',.09)}if(m.st!=='count')lastCd=-1},
  g(m){banner={txt:'BUT ! '+m.n+(m.own?' (contre son camp)':''),col:TC[m.tm],t:performance.now()};shake=1.2;
    const col=new THREE.Color(TCN[m.tm]);for(let i=0;i<220;i++)spawn((Math.random()-.5)*10,2+Math.random()*4,(m.tm===0?1:-1)*(AL/2+2),(Math.random()-.5)*26,Math.random()*22,(m.tm===0?-1:1)*Math.random()*14,1.6+Math.random(),Math.random()<.5?col:new THREE.Color(1,1,1));
    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.09),i*110))},
  h(m){tone(110+m.v*260,.09,'square',.04+m.v*.06);shake=Math.max(shake,m.v*.5)},
  res(m){lastRes=m},
  back(){toLobby()},
  pong(m){ping=Math.round(performance.now()-m.ts);$('#ping').textContent=ping+' ms'},
  err(m){$('#err').textContent=m.m;$('#go').disabled=false}
};
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{$('#conn').textContent='Connexion…';send({t:'hello',tok,n:$('#name').value.trim()});clearInterval(pingT);pingT=setInterval(()=>send({t:'ping',ts:performance.now()}),2000)};
  ws.onmessage=e=>{const m=JSON.parse(e.data);H_[m.t]&&H_[m.t](m)};
  ws.onclose=()=>{ready=false;clearInterval(pingT);['#go','#r1','#r2'].forEach(s=>$(s).disabled=true);$('#conn').textContent='Connexion perdue… nouvelle tentative';
    if(joined)toLobby();setTimeout(connect,2000)};
}
function curName(){const n=$('#name').value.trim()||(PROF&&PROF.name)||'Joueur';return n}
$('#go').onclick=()=>{audio();$('#err').textContent='';$('#go').disabled=true;send({t:'join',n:curName(),r:$('#room').value.trim(),c:myCar})};
$('#r1').onclick=()=>{audio();send({t:'queue',pl:1,n:curName(),c:myCar})};$('#r2').onclick=()=>{audio();send({t:'queue',pl:2,n:curName(),c:myCar})};
$('#qc').onclick=()=>send({t:'unq'});
$('#room').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#name').addEventListener('change',()=>send({t:'name',n:$('#name').value.trim()}));
$('#room').value=(new URLSearchParams(location.search).get('room')||'').toUpperCase();
$('#copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.origin+'/?room='+room).then(()=>toast('Lien copié !'),()=>toast(location.href))};
$('#addbot').onclick=()=>send({t:'bot',a:1});$('#rmbot').onclick=()=>send({t:'bot',a:-1});$('#team').onclick=()=>send({t:'team'});
$('#leave').onclick=()=>{if(ranked&&!confirm('Quitter une partie classée compte comme une défaite. Quitter ?'))return;send({t:'leave'})};
document.querySelectorAll('#bar button').forEach(b=>b.addEventListener('click',()=>b.blur()));

/* ---------- entrées (touches physiques : ZQSD sur AZERTY) ---------- */
const K={};let MB=0;
function sendIn(){if(!joined)return;const i={t:'in',w:+!!(K.KeyW||K.ArrowUp),s:+!!(K.KeyS||K.ArrowDown),a:+!!(K.KeyA||K.ArrowLeft),d:+!!(K.KeyD||K.ArrowRight),
  j:+!!K.Space,b:+!!(K.ShiftLeft||K.ShiftRight||K.KeyX||MB),q:+!!K.KeyQ,e:+!!K.KeyE};const s=JSON.stringify(i);if(s!==lastIn){lastIn=s;ws.send(s)}}
addEventListener('keydown',e=>{if(!joined)return;if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();
  if(!e.repeat){if(!ranked){if(e.code==='KeyB')send({t:'bot',a:1});if(e.code==='KeyN')send({t:'bot',a:-1});if(e.code==='KeyT')send({t:'team'})}
    if(e.code==='KeyC'){ballCam=!ballCam;toast(ballCam?'Caméra : balle':'Caméra : voiture')}}
  K[e.code]=1;sendIn()});
addEventListener('keyup',e=>{K[e.code]=0;sendIn()});
addEventListener('blur',()=>{for(const k in K)K[k]=0;MB=0;sendIn()});
$('#gl').addEventListener('mousedown',e=>{if(e.button===2){MB=1;sendIn()}});
addEventListener('mouseup',e=>{if(e.button===2){MB=0;sendIn()}});
addEventListener('contextmenu',e=>{if(joined)e.preventDefault()});

/* ---------- interpolation ---------- */
function view(){
  if(!snaps.length)return null;
  const now=performance.now()-100;let i=snaps.length-1;while(i>0&&snaps[i].rt>now)i--;
  const a=snaps[i],b=snaps[i+1];if(!b||a.rt>now)return a;
  const f=clamp((now-a.rt)/(b.rt-a.rt),0,1),L=(p,q)=>p+(q-p)*f;
  const bl=Math.hypot(b.b[0]-a.b[0],b.b[1]-a.b[1],b.b[2]-a.b[2])>20?b.b:[L(a.b[0],b.b[0]),L(a.b[1],b.b[1]),L(a.b[2],b.b[2])];
  const am={};a.c.forEach(c=>am[c[0]]=c);
  const cs=b.c.map(c=>{const p=am[c[0]];if(!p||Math.hypot(c[1]-p[1],c[2]-p[2],c[3]-p[3])>20)return c;
    return[c[0],L(p[1],c[1]),L(p[2],c[2]),L(p[3],c[3]),p[4]+wrap(c[4]-p[4])*f,L(p[5],c[5]),p[6]+wrap(c[6]-p[6])*f,c[7],c[8],Math.abs(c[9]-p[9])>3?c[9]:L(p[9],c[9]),Math.abs(c[10]-p[10])>3?c[10]:L(p[10],c[10])]});
  return{...b,b:bl,c:cs};
}

/* ---------- caméra façon Rocket League ---------- */
const camDir=new THREE.Vector3(0,0,1),camPos=new THREE.Vector3(0,20,-60);
function updateCam(S,dt){
  const me=S.c.find(c=>c[0]===myId);
  if(!me){camera.position.set(0,50,-95);camera.lookAt(0,0,0);return}
  const cp=new THREE.Vector3(me[1],me[2],me[3]),bp=new THREE.Vector3(S.b[0],S.b[1],S.b[2]);
  const fwd=new THREE.Vector3(Math.sin(me[4]),0,Math.cos(me[4]));
  const dir=ballCam?bp.clone().sub(cp):fwd.clone();dir.y=0;if(dir.lengthSq()<1)dir.copy(fwd);dir.normalize();
  camDir.lerp(dir,1-Math.exp(-dt*7)).normalize();
  const want=cp.clone().addScaledVector(camDir,-14);want.y=cp.y+6+(ballCam?clamp(bp.y*.25,0,5):0);
  want.x=clamp(want.x,-AW/2+2,AW/2-2);want.z=clamp(want.z,-AL/2-GD+2,AL/2+GD-2);want.y=clamp(want.y,2.5,AH-2);
  camPos.lerp(want,1-Math.exp(-dt*9));camera.position.copy(camPos);
  if(shake>.01){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake;shake*=.9}
  const look=ballCam?cp.clone().lerp(bp,.6):cp.clone().addScaledVector(camDir,14);look.y+=1.2;camera.lookAt(look);
}

/* ---------- boucle de rendu ---------- */
let lastT=performance.now(),pb=null;
const _ax=new THREE.Vector3();
function fmt(t){return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function frame(t){
  requestAnimationFrame(frame);const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  if(!joined){ // menu : salle d'exposition
    if(showCar)showCar.rotation.y+=dt*.7;
    camera.position.set(500,3.4,10.5);camera.lookAt(496.5,1,0);updP(dt);renderer.render(scene,camera);return}
  const S=view();if(!S){renderer.render(scene,camera);return}
  if(pb){const dx=S.b[0]-pb[0],dz=S.b[2]-pb[2],d=Math.hypot(dx,dz);if(d>1e-4&&d<5){_ax.set(dz,0,-dx).normalize();ball.rotateOnWorldAxis(_ax,d/BR)}}
  pb=S.b;ball.position.set(S.b[0],S.b[1],S.b[2]);ballLight.position.set(S.b[0],S.b[1]+4,S.b[2]);
  ballShadow.position.x=S.b[0];ballShadow.position.z=S.b[2];ballShadow.scale.setScalar(BR*Math.max(.4,1-S.b[1]/40));
  padMeshes.forEach((m,i)=>{m.material.opacity=S.p[i]==='1'?1:.18});
  const seen={};
  S.c.forEach(c=>{const o=ensureCar(c[0]);if(!o)return;seen[c[0]]=1;
    o.mesh.position.set(c[1],c[2],c[3]);o.mesh.rotation.set(c[5]+c[9],c[4],c[6]+c[10],'YXZ');
    o.label.position.set(c[1],c[2]+3.2,c[3]);o.shadow.position.x=c[1];o.shadow.position.z=c[3];o.shadow.scale.setScalar(2*Math.max(.4,1-c[2]/30));
    const fl=!!(c[8]&1);o.mesh.userData.flame.visible=fl;
    if(fl){const fx=Math.sin(c[4])*Math.cos(c[5]),fy=-Math.sin(c[5]),fz=Math.cos(c[4])*Math.cos(c[5]);
      for(let k=0;k<2;k++)spawn(c[1]-fx*2.2,c[2]-fy*2.2,c[3]-fz*2.2,-fx*(8+Math.random()*6)+(Math.random()-.5)*2,-fy*8+(Math.random()-.5)*2,-fz*(8+Math.random()*6)+(Math.random()-.5)*2,.35,{r:1,g:.55+Math.random()*.3,b:.1})}});
  for(const id in cars)if(!seen[id]){scene.remove(cars[id].mesh,cars[id].label,cars[id].shadow);delete cars[id]}
  updP(dt);updateCam(S,dt);renderer.render(scene,camera);hud(S,t);
}
function hud(S,t){
  $('#s0').textContent=S.sc[0];$('#s1').textContent=S.sc[1];$('#tm').textContent=(S.ot?'+':'')+fmt(S.tm);
  const me=S.c.find(c=>c[0]===myId);if(me){$('#boost').style.setProperty('--p',me[7]);$('#bv').textContent=me[7]}
  let k='',h='';
  if(S.st==='wait'){k='w';h='En attente d\'un adversaire…<small>Copie le lien pour inviter un ami, ou appuie sur B pour ajouter un bot</small>'}
  else if(S.st==='count'){k='c'+S.cd;h=S.cd>0?S.cd:'GO !'}
  else if(S.st==='over'){const w=S.w>=0?S.w:(S.sc[0]>S.sc[1]?0:1),mine=(roster[myId]||{tm:0}).tm===w;k='o'+w+mine+(lastRes?1:0);
    let sub=S.sc[0]+' - '+S.sc[1];
    if(lastRes)sub+=` · ${lastRes.delta>=0?'+':''}${lastRes.delta} MMR · ${lastRes.after.label}`+(lastRes.place<5?` (placement ${lastRes.place}/5)`:'');
    h=`<span style="color:${TC[w]}">${mine?'VICTOIRE !':'DÉFAITE'}</span><small>${sub}</small>`}
  else if(banner&&t-banner.t<2600){k='b'+banner.t;h=`<span style="color:${banner.col}">${banner.txt}</span>`}
  else if(S.ot){k='ot';h='<small style="margin:0;color:#ffd24a">PROLONGATION · but en or</small>';$('#msg').style.top='12%'}
  if(k!==msgKey){msgKey=k;$('#msg').innerHTML=h;if(k!=='ot')$('#msg').style.top='28%'}
}
connect();setShow('octane');
requestAnimationFrame(frame);
</script></body></html>
